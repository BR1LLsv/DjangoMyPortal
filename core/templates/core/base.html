{% load static %}  <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>МійПортал</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'dashboard' %}" class="nav-brand">МійПортал</a>
            <div class="nav-links">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Дашборд</a>
                    <a href="{% url 'notes' %}" class="{% if request.resolver_match.url_name == 'notes' %}active{% endif %}">Завдання</a>
                    <a href="{% url 'inbox' %}" style="position: relative;"> 
                        Повідомлення 
                        {% if unread_messages_count > 0 %}
                            <span style="
                                background: #ef4444; 
                                color: white; 
                                border-radius: 50%; 
                                padding: 2px 6px; 
                                font-size: 0.75rem; 
                                font-weight: bold; 
                                position: absolute; 
                                top: -10px; 
                                right: -15px;
                            ">{{ unread_messages_count }}</span> 
                        {% endif %}
                    </a>
                    <a href="{% url 'profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">Профіль</a>
                    <form action="{% url 'logout' %}" method="POST" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout">Вихід</button>
                    </form>
                    {% else %}
                    <a href="{% url 'login' %}" class="{% if request.resolver_match.url_name == 'login' %}active{% endif %}">Вхід</a>
                    <a href="{% url 'register' %}" class="{% if request.resolver_match.url_name == 'register' %}active{% endif %}">Реєстрація</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
