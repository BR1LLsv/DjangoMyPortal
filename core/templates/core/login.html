{% extends 'core/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Вхід у систему</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Увійти</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Немає профілю? <a href="{% url 'register' %}" style="color: var(--primary);">Створити акаунт</a>
    </p>
</div>
{% endblock %}
