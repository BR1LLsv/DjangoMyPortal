{% extends 'core/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 2rem auto;">
    <h2>Реєстрація профілю</h2>
    <form method="POST">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color: var(--danger); font-size: 0.85rem;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%;">Зареєструватися</button>
    </form>
    <p style="margin-top: 1rem; text-align: center; font-size: 0.9rem;">
        Вже маєте акаунт? <a href="{% url 'login' %}" style="color: var(--primary);">Увійти</a>
    </p>
</div>
{% endblock %}
